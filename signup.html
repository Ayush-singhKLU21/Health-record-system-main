<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Health Records System</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <div class="logo">
            🏥 HealthCare
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- Registration Form -->

    <div class="form-container">

        <h2>Create Account</h2>

        <form id="signupForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10 digit mobile number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="role">
                    Account Type
                </label>

                <select id="role">

                    <option value="user">
                        Patient / User
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="btn">

                Register

            </button>

        </form>


        <p style="text-align:center; margin-top:15px;">

            Already have an account?

            <a href="login.html">
                Login here
            </a>

        </p>

    </div>


    <!-- JavaScript -->

    <script src="js/auth.js"></script>

</body>

</html>
