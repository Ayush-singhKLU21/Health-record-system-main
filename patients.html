<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Patients</title><link rel="stylesheet" href="css/style.css"></head><body><header class="navbar"><div class="logo">🏥 HealthCare</div><nav><a href="admin.html">Dashboard</a><a href="records.html">Records</a><a href="appointments.html">Appointments</a><a href="login.html" onclick="localStorage.removeItem('currentUser')">Logout</a></nav></header><main class="dashboard"><h1>Patient Management</h1><div class="form-container"><form id="patientForm"><div class="form-group"><label>Name</label><input id="patientName" required></div><div class="form-group"><label>Email</label><input type="email" id="patientEmail" required></div><div class="form-group"><label>Mobile</label><input id="patientMobile" required></div><div class="form-group"><label>Gender</label><select id="patientGender"><option>Male</option><option>Female</option><option>Other</option></select></div><div class="form-group"><label>Date of Birth</label><input type="date" id="patientDob"></div><div class="form-group"><label>Blood Group</label><input id="patientBloodGroup" placeholder="e.g. O+"></div><div class="form-group"><label>Address</label><textarea id="patientAddress"></textarea></div><button class="btn">Add Patient</button></form></div><div class="table-container"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>Gender</th><th>Action</th></tr></thead><tbody id="patientsTable"></tbody></table></div></main><script src="js/patients.js"></script></body></html>
