<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Medical Records</title><link rel="stylesheet" href="css/style.css"></head><body><header class="navbar"><div class="logo">🏥 HealthCare</div><nav><a href="user.html">Dashboard</a><a href="appointments.html">Appointments</a><a href="profile.html">Profile</a><a href="login.html" onclick="localStorage.removeItem('currentUser')">Logout</a></nav></header><main class="dashboard"><h1>Medical Records</h1><div class="form-container"><form id="recordForm"><div class="form-group"><label>Patient Name</label><input id="recordPatient" required></div><div class="form-group"><label>Doctor</label><input id="recordDoctor" required></div><div class="form-group"><label>Diagnosis</label><input id="recordDiagnosis" required></div><div class="form-group"><label>Medicines</label><textarea id="recordMedicines" placeholder="Medicine and dosage"></textarea></div><div class="form-group"><label>Notes</label><textarea id="recordNotes"></textarea></div><div class="form-group"><label>Date</label><input type="date" id="recordDate" required></div><button class="btn">Add Record</button></form></div><div class="table-container"><table><thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Diagnosis</th><th>Medicines</th><th>Date</th><th>Action</th></tr></thead><tbody id="recordsTable"></tbody></table></div></main><script src="js/records.js"></script></body></html>
