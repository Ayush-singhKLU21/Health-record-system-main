<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

<header class="navbar">

    <div class="logo">
        🏥 HealthCare
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="signup.html">
            Register
        </a>

    </nav>

</header>


<div class="form-container">

    <h2>Login</h2>


    <form id="loginForm">

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter email"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
                required
            >

        </div>


        <button
            type="submit"
            class="btn">

            Login

        </button>

    </form>


    <p style="text-align:center; margin-top:15px;">

        Don't have an account?

        <a href="signup.html">
            Register
        </a>

    </p>

</div>


<script src="js/auth.js"></script>

</body>

</html>
